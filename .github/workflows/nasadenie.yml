name: Nasadenie na GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      nasadit: ${{ steps.ff.outputs.nasadit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Vetva claude/* sa nasadí len vtedy, keď sa main dá posunúť fast-forwardom na tento commit.
      # Inak by sa nasadila staršia verzia bez práce, ktorá je už v main (paralelní agenti).
      - name: Rozhodnutie o nasadeni
        id: ff
        run: |
          if [[ "$GITHUB_REF" == refs/heads/claude/* ]]; then
            if git push origin HEAD:main; then
              echo "nasadit=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::main sa nedal posunut fast-forwardom - tento commit sa NEnasadi; najprv rebase na origin/main"
              echo "nasadit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "nasadit=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22

      - name: Instalacia, testy, build
        if: hashFiles('package.json') != ''
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
          npm run build

      - name: Docasna stranka (appka sa este stavia)
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recepty</title></head>
          <body style="font-family:system-ui,sans-serif;padding:24px;line-height:1.5"><h1>Recepty</h1><p>Appka sa práve stavia v cloude. Skús to ráno.</p></body></html>
          EOF

      - uses: actions/configure-pages@v5
        if: steps.ff.outputs.nasadit == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.ff.outputs.nasadit == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.nasadit == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
